<style>
:root{--bg:#f5f5f5;--card:#fff;--card2:#f2f2f2;--accent:#d11f26;--accent2:#d11f26;--txt:#141414;--mut:#666;--ok:#0b7a4b;--warn:#f59e0b;--bad:#b91c1c;--ret:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px}
@media(min-width:900px){.wrap{max-width:760px}}
#installBox{display:none;margin-top:10px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.logo{width:44px;height:44px;border-radius:50%;flex:none}
.top h1{font-size:20px}.top small{color:var(--mut);font-size:12px;display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid #e3e3e3}
.req.al-red{border-inline-start:5px solid #dc2626}
.req.al-yellow{border-inline-start:5px solid #d97706}
.req.al-green{border-inline-start:5px solid #16a34a}
.req.al-gray{border-inline-start:5px solid #9ca3af}
.al-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-bottom:6px}
.al-tag.al-red{background:#fee2e2;color:#991b1b}
.al-tag.al-yellow{background:#fef3c7;color:#92400e}
.al-tag.al-green{background:#dcfce7;color:#166534}
.al-tag.al-gray{background:#e5e7eb;color:#374151}
.badge{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;position:absolute;top:6px;inset-inline-end:6px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.icon-btn{position:relative}
.badge.inline{position:static;margin-inline-start:4px;min-width:16px;height:16px;font-size:10px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn{background:var(--accent2);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.ok{background:var(--ok)}.btn.bad{background:#b91c1c;color:#fff}.btn.warn{background:var(--warn);color:#1f2937}.btn.ret{background:var(--ret)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:9px}
input,select,textarea{width:100%;background:#fff;border:1px solid #e3e3e3;color:var(--txt);border-radius:10px;padding:11px;font-size:15px;margin-bottom:10px;font-family:'Cairo',sans-serif}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.icon-btn{background:var(--card);border:1px solid #e3e3e3;border-radius:16px;padding:18px 8px;text-align:center;cursor:pointer;color:var(--txt)}
.icon-btn .em{font-size:30px;display:block;margin-bottom:6px}
.icon-btn span.t{font-size:14px;font-weight:700}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.c-pending{background:#fde68a;color:#78350f}.c-approved{background:#bbf7d0;color:#14532d}.c-rejected{background:#fecaca;color:#7f1d1d}.c-returned{background:#ddd6fe;color:#4c1d95}.c-paid{background:#a5f3fc;color:#164e63}.c-awaiting_fa{background:#fde68a;color:#78350f}.c-closed{background:#bbf7d0;color:#14532d}
.req{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px;overflow:hidden}
.req h4{font-size:15px;margin-bottom:4px}.req p{font-size:13px;color:var(--mut);white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mut{color:var(--mut);font-size:12px}
.err{background:#fecaca;color:#7f1d1d;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px;display:none}
.okmsg{background:#bbf7d0;color:#14532d;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px;display:none}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;min-width:70px;justify-content:center;padding-inline:6px}
.tabs button{flex:1;background:var(--card);border:1px solid #e3e3e3;color:var(--mut);padding:9px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px}
.tabs button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.tl{border-right:2px solid #ccc;padding-right:12px;margin:8px 0}
.tl div{margin-bottom:8px;font-size:13px}.tl .mut{font-size:11px}
.att a{color:var(--accent);font-size:12px;display:block;max-width:100%;overflow-wrap:anywhere;word-break:break-all;direction:ltr;text-align:right;unicode-bidi:plaintext}
.demo{background:#fff;border:1px dashed #ccc;border-radius:12px;padding:10px;font-size:12px;color:var(--mut);margin-top:12px}
#repTable{overflow-x:auto}
.rep{width:100%;border-collapse:collapse;font-size:12px}
table.rep{width:100%;table-layout:fixed}@media screen{table.rep{min-width:620px}}
table.rep th,table.rep td{border:1px solid #ccc;padding:4px;text-align:right;overflow-wrap:break-word;font-size:11px;line-height:1.5}
table.rep th{font-size:10px;padding:4px 3px}
table.rep th{background:var(--card2)}
@media print{.wrap:has(.docs-only) .top{display:none!important}.docs-only .print-det .req{background:#fff!important}.docs-only table.rep,.docs-only .print-det>h3,.docs-only .print-det .req>h4,.docs-only .print-det .req>p,.docs-only .print-det .req a,.docs-only .print-det .req>div>p,.docs-only>p.mut,.dochead{display:none!important}.docs-only .print-det .req{border:0!important;padding:0!important;margin:0!important}.docs-only .print-det img.att-img{max-height:250mm;margin:0 auto 6mm;border:0;page-break-inside:avoid}}
@media print{@page{margin:8mm}body{background:#fff;color:#000}.no-print,.tabs,#app>.card:first-child{display:none!important}.card{border:0;background:#fff;padding:4px!important}table.rep th{background:#eee}table.rep th,table.rep td{border-color:#999;color:#000}.print-det{display:block!important}.print-det .req{break-inside:avoid;border:1px solid #999;border-radius:0;margin:0 0 10px;padding:8px}.print-det img.att-img{max-width:100%;max-height:340px;display:block;margin:6px 0;border:1px solid #ccc}}
.print-det{display:none}
.print-det.show{display:block}
.print-det img.att-img{max-width:100%;max-height:340px;display:block;margin:6px 0;border:1px solid #ddd}
h3.sec{font-size:16px;margin:6px 0 10px;color:var(--accent)}
button,button *,.tabs,.tabs *,.icon-btn,.icon-btn *,.btn,.chip,.badge,.al-tag,label,h3,h4,.sec{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,.icon-btn,.btn,.tabs button{touch-action:manipulation}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>

// ---------- GEO ----------
function _geoOnce(opts){return new Promise(res=>{
 navigator.geolocation.getCurrentPosition(
  p=>res({state:'granted',lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),
  e=>res({state:e.code===1?'denied':(e.code===3?'timeout':'unavailable'),code:e.code,msg:e.message||''}),
  opts);
});}
async function getLoc(){
 if(!navigator.geolocation)return {state:'unavailable',code:0};
 let r=await _geoOnce({timeout:10000,maximumAge:300000,enableHighAccuracy:false});
 if(r.state==='granted'||r.state==='denied')return r;
 r=await _geoOnce({timeout:20000,maximumAge:0,enableHighAccuracy:true});
 return r;
}
const LOC_MSG={denied:'إذن الموقع مرفوض لهذا الموقع في المتصفح. افتح إعدادات الموقع في المتصفح (أيقونة القفل بجوار العنوان ← الأذونات ← الموقع ← سماح) ثم أعد المحاولة. بياناتك محفوظة في النموذج.',timeout:'تعذر تحديد الموقع: انتهت المهلة. اقترب من نافذة أو مكان مفتوح وفعّل الـGPS ثم اضغط "تحقق من الموقع" بالأسفل. بياناتك محفوظة.',unavailable:'خدمة الموقع غير متاحة الآن على الجهاز رغم تفعيل الموقع. فعّل "دقة الموقع المحسّنة/Google Location Accuracy" أو انتقل لمكان به تغطية أفضل ثم حاول. بياناتك محفوظة.'};
async function checkLoc(){
 const el=$('locStat');el.style.display='block';el.className='mut';el.textContent='جارٍ تحديد الموقع…';
 const r=await getLoc();
 if(r.state==='granted'){el.className='okmsg';el.style.display='block';el.textContent='تم تحديد الموقع بدقة '+r.acc+' متر تقريبًا. يمكنك الإرسال الآن.';window._preLoc=r;window._preLocAt=Date.now();}
 else{el.className='err';el.style.display='block';el.textContent=(LOC_MSG[r.state]||LOC_MSG.unavailable)+' (رمز '+(r.code??'?')+')';window._preLoc=null;}

// ---------- ATTACHMENTS (data URLs inside the request row; row-level access only) ----------
function fileToAtt(f){return new Promise((res,rej)=>{
 const done=(data)=>res({name:f.name,type:f.type,data});
 if(f.type.startsWith('image/')){
  const img=new Image();const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
   const mx=1200;let w=img.width,h=img.height;
   if(w>mx||h>mx){const k=mx/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   done(c.toDataURL('image/jpeg',0.7));
  };img.onerror=rej;img.src=rd.result};rd.onerror=rej;rd.readAsDataURL(f);
 }else{
  if(f.size>500*1024)return rej(new Error('الملف أكبر من 500KB'));
  const rd=new FileReader();rd.onload=()=>done(rd.result);rd.onerror=rej;rd.readAsDataURL(f);
 }
});}
async function uploadFiles(input){
 const out=[];
 for(const f of input.files){try{out.push(await fileToAtt(f))}catch(e){out.push({name:f.name,error:e.message})}}
 return out;
}
window._attReg=window._attReg||[];
function attIsImg(a){return (a.type&&a.type.startsWith('image/'))||(a.data&&a.data.startsWith('data:image'))}
function attLinks(atts){

  const i=window._attReg.push(a)-1;
  return attIsImg(a)
   ?`<img src="${a.data}" alt="${esc(a.name)}" loading="lazy" onclick="attOpen(${i})" style="width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid #ccc;cursor:pointer;background:#fff">`
   :`<button type="button" class="btn ghost sm" onclick="attOpen(${i})">📎 ${esc(a.name)}</button>`;
 }).join('')+'</div><p class="mut" style="font-size:12px;margin:2px 0 6px">اضغط على المرفق لعرضه بالكامل</p>';

function attClose(){const o=document.getElementById('attov');if(o){if(o._url)URL.revokeObjectURL(o._url);o.remove();document.body.style.overflow=''}}
async function attOpen(i){
 const a=window._attReg[i];if(!a||!a.data)return;
 attClose();
 const o=document.createElement('div');o.id='attov';
 o.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.9);display:flex;flex-direction:column';
 o.onclick=e=>{if(e.target===o||e.target.id==='attbody')attClose()};
 let body;
 if(attIsImg(a)){body=`<img src="${a.data}" alt="" style="max-width:100%;max-height:100%;object-fit:contain;background:#fff">`}
 else{
  try{const b=await (await fetch(a.data)).blob();o._url=URL.createObjectURL(b);
   body=`<iframe src="${o._url}" style="width:100%;height:100%;border:0;background:#fff"></iframe>`;
   var dl=`<a href="${o._url}" download="${esc(a.name)}" style="color:#fff;font-weight:700;margin-inline-start:14px">تحميل الملف</a>`}
  catch(e){body='<p style="color:#fff">تعذر عرض الملف</p>'}
 }
 o.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:#111;color:#fff;font-size:14px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">${esc(a.name)}${typeof dl!=='undefined'?dl:''}</span><button type="button" onclick="attClose()" style="background:#fff;color:#111;border:0;border-radius:8px;padding:8px 16px;font-size:15px;font-weight:700;min-height:40px">إغلاق ✕</button></div><div id="attbody" style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px">${body}</div>`;
 document.body.appendChild(o);document.body.style.overflow='hidden';
}

function alClass(n,reqs){
 const t=n.text||'';
 if(t.startsWith('وصل'))return ['al-yellow','📥 وصل للإدارية'];
 if(t.startsWith('الشؤون المالية أعادت'))return ['al-red','↩️ أعادتها الشؤون المالية'];
 if(t.startsWith('الشؤون المالية:'))return ['al-green',ic('money',14)+' تمت المراجعة'];
 if(t.startsWith('سلفة: رفضت'))return ['al-red','❌ رفض طلب سلفة'];
 if(t.startsWith('سلفة: وافقت'))return ['al-green',ic('money',14)+' موافقة على السلفة'];
 if(t.startsWith('سلفة: طلبت'))return ['al-yellow',ic('money',14)+' طلب سلفة'];
 if(t.startsWith('سلفة: قفلت'))return ['al-green',ic('money',14)+' سلفة مقفولة'];
 if(t.startsWith('سلفة: أعادت'))return ['al-yellow',ic('money',14)+' سلفة أُعيد فتحها'];
 if(t.startsWith('سلفة'))return ['al-green',ic('money',14)+' تحويل سلفة من الشؤون المالية'];
 const req=reqs.find(r=>r.id===n.request_id);
 const st=req?req.status:null;
 if(t.includes('رفض'))return ['al-red','❌ طلب مرفوض'];
 if(t.includes('استكمال')){
  if(st==='returned')return ['al-red','↩️ مطلوب استكمال — بانتظار ردّك'];
  if(st==='pending')return ['al-yellow','↩️ استكمال سابق — أُعيد إرساله وقيد المراجعة'];
  if(st==='approved')return ['al-green','↩️ استكمال سابق — تمت الموافقة عليه'];
  if(st==='paid')return ['al-green','↩️ استكمال سابق — تم تسجيل الصرف'];
  if(st==='awaiting_fa')return ['al-green','↩️ استكمال سابق — بانتظار المراجعة المالية'];
  if(st==='closed')return ['al-green','↩️ استكمال سابق — مقفول ماليًا'];
  return ['al-red','↩️ مطلوب استكمال'];
 }
 if(t.includes('الموافقة'))return ['al-green','✅ موافقة إدارية'];
 if(t.includes('صرف'))return ['al-green','💵 تم تسجيل الصرف'];
 if(t.includes('قفل')||t.includes('إغلاق'))return ['al-green','🔒 قفل مالي'];
 return ['al-gray','ℹ️ تنبيه'];
}

 const st=STATUS[r.status]||[r.status,'c-pending'];
 let extra='';
 if(r.status==='returned'&&mine)extra+=`<div class="err" style="display:block">ملاحظة الإدارية: ${esc(r.return_reason||'')}</div>
  <div class="row"><button class="btn ret sm" onclick='renderResubmit(${JSON.stringify(r)})'>✏️ استكمال وإعادة إرسال</button></div>`;
 if(r.status==='paid'||r.status==='awaiting_fa'||r.status==='closed')extra+=`<p class="mut">صُرف: ${fmtMoney(r.paid_amount)} بتاريخ ${fmtDate(r.paid_date)} (${esc(r.paid_method||'—')})${r.paid_recipient?` · المستلم ${esc(r.paid_recipient)}`:''}</p>${attLinks(r.paid_proof&&r.paid_proof.length?r.paid_proof.map(p=>({name:'إثبات الصرف: '+p.name,data:p.data})):null)}`;
 return `<div class="req" id="req-${r.id}">
  <h4>${KINDS[r.kind]||r.kind} <span class="chip ${st[1]}">${st[0]}</span>${r.revision_no>1?` <span class="mut">مراجعة ${r.revision_no}</span>`:''}</h4>
  ${mine&&STLINE[r.status]?`<p style="color:var(--txt);font-weight:700;font-size:13px">${STLINE[r.status]}</p>`:''}
  ${r.category?`<p class="mut">${esc(r.category)}</p>`:''}
  <p>${esc(r.details||'')}</p>
  ${r.amount?`<p>المبلغ: <b>${fmtMoney(r.amount)}</b></p>`:''}

  <div id="hist-${r.id}" class="${mine?'autohist':''}"></div>
 </div>`;
}

async function submitReq(kind,resubmitId){
 const btn=$('sendBtn'); if(btn){if(btn.disabled)return; btn.disabled=true; setTimeout(()=>btn.disabled=false,5000);}
 $('sendBtn').disabled=true;$('sendBtn').textContent='جارٍ الإرسال...';
 try{
  let loc=(window._preLoc&&(Date.now()-(window._preLocAt||0)<120000))?window._preLoc:{state:'not_provided'};
  window._preLoc=null;
  const files=$('f_files');let atts=window._resubmitAtts||[];
  if(files&&files.files.length)atts=atts.concat(await uploadFiles(files));
  const cat=$('f_cat')?$('f_cat').value:null;
  const catLabel=cat?(MCASES[cat]||LCASES[cat]||SCASES[cat]||cat):null;
  let details=$('f_details').value.trim();
  if(kind==='leave'&&$('f_date2')&&$('f_date2').value)details='من '+($('f_date').value||'—')+' إلى '+$('f_date2').value+'\n'+details;
  const amount=$('f_amount')&&$('f_amount').value?Number($('f_amount').value):null;
  const date=$('f_date')?$('f_date').value:null;
  if(!details&&!amount){show('err','اكتب التفاصيل أو المبلغ');$('sendBtn').disabled=false;$('sendBtn').textContent='إرسال الإخطار';return}
  if(!window._reqIdem)window._reqIdem=crypto.randomUUID();
  let r;
  if(resubmitId){
   r=await sb.rpc('resubmit_request',{p_code:ME.code,p_pin:window._pin,p_request_id:resubmitId,p_details:details,p_amount:amount,p_notes:null,p_attachments:atts,p_lat:loc.lat||null,p_lng:loc.lng||null,p_loc_acc:loc.acc||null,p_loc_state:(loc.state==='granted'?'granted':null)});
  }else{
   r=await sb.rpc('submit_request',{p_code:ME.code,p_pin:window._pin,p_kind:kind,p_category:catLabel,p_details:details,p_amount:amount,p_request_date:date,p_notes:null,p_lat:loc.lat||null,p_lng:loc.lng||null,p_loc_acc:loc.acc||null,p_loc_state:loc.state,p_attachments:atts,p_idem:window._reqIdem});
  }
  if(r.error){show('err','خطأ: '+r.error.message);$('sendBtn').disabled=false;$('sendBtn').textContent='إرسال الإخطار';return}
  window._resubmitAtts=null;window._reqIdem=null;
  renderEmp('mine');
 }catch(e){show('err','خطأ: '+e.message);$('sendBtn').disabled=false;$('sendBtn').textContent='إرسال الإخطار'}
}

async function aaAct(id,action){

 renderAA('queue');

async function loadAAApproved(){
 const rep=await sb.rpc('aa_reports',{p_code:ME.code,p_pin:window._pin});
 const FIN=k=>k==='settlement'||k==='maintenance';
 const approved=(rep.data||[]).filter(r=>(r.status==='approved'||r.status==='paid')&&FIN(r.kind));
 const nonfin=(rep.data||[]).filter(r=>r.status==='approved'&&!FIN(r.kind));
 let html='';
 if(nonfin.length)html+='<h3 class="sec">موافقات نهائية — لا صرف مطلوب</h3>'+nonfin.map(r=>`<div class="req"><h4>${esc(r.employee_name)} — ${KINDS[r.kind]} <span class="chip c-approved">موافقة نهائية</span></h4><p class="mut">${esc(r.details||'')}</p></div>`).join('');
 if(!approved.length){if(html)$('app').querySelector('.card:last-child').insertAdjacentHTML('beforeend',html);return;}
 html+='<h3 class="sec">بانتظار الصرف / الإحالة للمالية</h3>'+approved.map(r=>{
  const st=STATUS[r.status];
  return `<div class="req"><h4>${esc(r.employee_name)} — ${KINDS[r.kind]} <span class="chip ${st[1]}">${st[0]}</span></h4>
   <p>المبلغ: <b>${fmtMoney(r.amount)}</b></p>
   ${r.status==='approved'?`<div style="border:1px dashed #ccc;border-radius:10px;padding:8px;margin-top:6px">
    <div class="row"><input id="pm-${r.id}" placeholder="المبلغ الفعلي" type="number" inputmode="decimal" style="width:110px"><input id="pdt-${r.id}" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="row"><select id="pmd-${r.id}"><option>كاش</option><option>فودافون كاش</option><option>تحويل بنكي</option><option>انستاباي</option></select><input id="prc-${r.id}" placeholder="رقم المستلم" inputmode="tel" style="width:140px"></div>
    <div class="row"><label class="mut" style="font-size:12px">إثبات الصرف:</label><input id="ppf-${r.id}" type="file" accept="image/*,.pdf" style="font-size:12px"></div>
    <button class="btn ok sm" id="payb-${r.id}" onclick="aaPay('${r.id}')">💸 تسجيل صرف</button></div>`
   :`<p class="mut">صُرف: ${fmtMoney(r.paid_amount)} · ${esc(r.paid_method||'')} · ${fmtDate(r.paid_date)}${r.paid_recipient?` · المستلم ${esc(r.paid_recipient)}`:''}</p>${r.paid_proof&&r.paid_proof.length?attLinks(r.paid_proof):''}<div class="row"><button class="btn warn sm" onclick="aaSendFa('${r.id}')">📤 إحالة للمراجعة المالية</button></div>`}
  </div>`;
 }).join('');
 $('app').querySelector('.card:last-child').insertAdjacentHTML('beforeend',html);
}
async function aaPay(id){
 const btn=$('payb-'+id); if(btn){btn.disabled=true;setTimeout(()=>btn.disabled=false,5000);}
 const amt=$('pm-'+id).value?Number($('pm-'+id).value):null;
 const method=$('pmd-'+id).value||'كاش';
 const dt=$('pdt-'+id).value||null;
 const recip=$('prc-'+id).value||null;
 let proof=[];
 const pf=$('ppf-'+id);
 if(pf&&pf.files.length)proof=await uploadFiles(pf);
 const r=await sb.rpc('pay_request',{p_code:ME.code,p_pin:window._pin,p_request_id:id,p_amount:amt,p_method:method,p_date:dt,p_recipient:recip,p_proof:proof});
 if(r.error){alert('خطأ: '+r.error.message);return}
 renderAA('queue');
}
async function aaSendFa(id){
 const r=await sb.rpc('aa_send_fa',{p_code:ME.code,p_pin:window._pin,p_request_id:id,p_note:null});
 if(r.error){alert('خطأ: '+r.error.message);return}
 renderAA('queue');
}

async function renderPdfSlots(){
 if(!window._pdfSlots||!window._pdfSlots.length)return;
 if(!window.pdfjsLib){for(const s of window._pdfSlots){const slot=document.getElementById(s.sid);if(slot)slot.innerHTML='<p class="mut">تعذر تضمين صفحات المستند (مكتبة العرض غير متاحة) — استخدم رابط فتح المستند الأصلي أعلاه.</p>'}return};
 for(const s of window._pdfSlots){
  const slot=document.getElementById(s.sid);if(!slot)continue;
  try{
   const raw=atob(s.data.split(',')[1]);const bytes=new Uint8Array(raw.length);
   for(let k=0;k<raw.length;k++)bytes[k]=raw.charCodeAt(k);
   const doc=await pdfjsLib.getDocument({data:bytes}).promise;
   const maxp=Math.min(doc.numPages,20);let h='';
   for(let pg=1;pg<=maxp;pg++){
    const page=await doc.getPage(pg);
    const vp=page.getViewport({scale:1.6});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    h+=`<img class="att-img" src="${c.toDataURL('image/jpeg',0.75)}" alt="${esc(s.name)} صفحة ${pg}">`;
   }
   slot.innerHTML=h+`<p class="mut">${esc(s.name)} — ${maxp===doc.numPages?maxp+' صفحة':maxp+' من '+doc.numPages+' صفحة'}</p>`;
  }catch(e){slot.innerHTML='<p class="mut">تعذر تضمين صفحات المستند — استخدم رابط فتح المستند الأصلي.</p>'}
 }
}

 <div class="row no-print"><button class="btn sm" onclick="exportXlsx()">⬇️ Excel</button><button class="btn ghost sm" onclick="window.print()">🖨️ PDF (المستندات فقط)</button></div><div id="repTable" class="docs-only" style="margin-top:10px"></div></div>`;
 renderRepTable();document.querySelector('.print-det').classList.add('show');
}

function advanceFields(){
 const td=new Date().toISOString().slice(0,10);
 return `<div>
 <label>المبلغ (ج.م)</label><input id="adv_amt" type="number" inputmode="decimal" placeholder="مثال 10000">
 <label>التحويل عبر</label><select id="adv_method"><option>محفظة</option><option>إنستاباي</option></select>
 <label>رقم المحفظة / إنستاباي</label><input id="adv_num" inputmode="tel">
 <label>تاريخ التحويل</label><input id="adv_date" type="date" value="${td}">
 <button class="btn" style="margin:8px 0;width:100%" onclick="sendAdvance(this)">إرسال الإشعار للإدارية</button><div id="advMsg"></div></div>`;
}
async function sendAdvance(btn){
 const m=$('advMsg');const amt=Number($('adv_amt').value||0);
 if(!(amt>0)){m.innerHTML='<div class="err" style="display:block">اكتب المبلغ</div>';return}
 if(!$('adv_num').value.trim()){m.innerHTML='<div class="err" style="display:block">اكتب رقم المحفظة أو إنستاباي</div>';return}
 btn.disabled=true;
 if(!window._advIdem)window._advIdem=crypto.randomUUID();
 const r=await sb.rpc('fa_advance_add',{p_code:ME.code,p_pin:window._pin,p_amount:amt,p_method:$('adv_method').value,p_number:$('adv_num').value.trim(),p_date:$('adv_date').value||null,p_note:null,p_idem:window._advIdem});
 if(r.error){m.innerHTML='<div class="err" style="display:block">'+esc(r.error.message)+'</div>';btn.disabled=false;return}
 window._advIdem=null;
 m.innerHTML='<div style="background:#dcfce7;color:#166534;padding:8px;border-radius:8px;margin-top:8px">وصل الإشعار للإدارية: '+esc((r.data&&r.data.text)||'')+'</div>';
 $('adv_amt').value='';$('adv_num').value='';setTimeout(()=>renderFA(),2500);
}


function _norm(x){return String(x||'').toLowerCase().replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}
async function renderFAArchive(q){
 q=q||'';
 const [bq,aq]=await Promise.all([sb.rpc('fa_batches',{p_code:ME.code,p_pin:window._pin}),sb.rpc('fa_advances_list',{p_code:ME.code,p_pin:window._pin})]);
 window._batches=bq.data||[];window._allAdv=aq.data||[];
 const nq=_norm(q.trim());
 const bs=window._batches.map((b,i)=>[b,i]).filter(([b])=>b.archived&&(!nq||_norm(b.code).includes(nq)));
 const as=window._allAdv.filter(a=>a.status==='closed'&&(!nq||_norm([a.amount,a.number,a.method].join(' ')).includes(nq)));
 const bh=bs.length?bs.map(([b,i])=>`<div class="req"><h4><span class="chip c-closed" style="direction:ltr">${esc(b.code||'')}</span> ${fmtDate(b.created_at)} — ${b.n} عملية · ${fmtMoney(b.total)}</h4><p class="mut">تمت المراجعة ${fmtDate(b.reviewed_at)}</p><div class="row"><button class="btn ghost sm" onclick="openBatch(${i})">فتح Excel / PDF</button><button class="btn ghost sm" onclick="restoreBatch('${b.id}')">إعادة للعمل</button></div></div>`).join(''):'<p class="mut">لا شيتات في الأرشيف'+(nq?' بهذا الكود':'')+'.</p>';
 const ah=as.length?as.map(a=>`<div class="req"><h4>${fmtMoney(a.amount)} <span class="chip c-closed">مقفولة</span></h4><p class="mut">${esc(a.method||'')} · ${esc(a.number||'')} · ${fmtDate(a.date)}</p><button class="btn ghost sm" onclick="reopenAdvance('${a.id}')">إعادة فتح</button></div>`).join(''):'<p class="mut">لا سلف مقفولة'+(nq?' مطابقة':'')+'.</p>';
 $('app').innerHTML=`<div class="card"><b>${ic('money',16)} ${esc(ME.name)}</b> <span class="mut">${esc(ME.job_title)}</span></div>
 <div class="tabs"><button onclick="renderHome()">${ic('home',14)} الرئيسية</button></div>
 <div class="card"><h3 class="sec">${ic('archive',16)} الأرشيف</h3><input id="arq" value="${esc(q)}" placeholder="ابحث بكود الشيت (مثال SH-0001)" oninput="clearTimeout(window._arT);window._arT=setTimeout(()=>renderFAArchive(document.getElementById('arq').value),350)">
 <h3 class="sec">الشيتات المراجعة (${bs.length})</h3>${bh}<h3 class="sec">السلف المقفولة (${as.length})</h3>${ah}</div>`;
 const el=$('arq');if(el&&q){el.focus();el.setSelectionRange(q.length,q.length)}
}
async function restoreBatch(id){const r=await sb.rpc('fa_batch_restore',{p_code:ME.code,p_pin:window._pin,p_batch:id});if(r.error){alert('خطأ: '+r.error.message);return}renderFAArchive();}
async function reopenAdvance(id){const r=await sb.rpc('fa_advance_reopen',{p_code:ME.code,p_pin:window._pin,p_id:id});if(r.error){alert('خطأ: '+r.error.message);return}renderFAArchive();}
async function renderEmpArchive(){
 const r=await sb.rpc('emp_archive_list',{p_code:ME.code,p_pin:window._pin});
 const list=r.data||[];
 const html=r.error?'<div class="err" style="display:block">تعذر تحميل الأرشيف: '+esc(r.error.message)+'</div>':(list.length?list.map(x=>reqCard(x,false).replace(/<span class="chip [^"]*">[^<]*<\/span>/,'<span class="chip c-closed">راجعتها المالية</span>')).join(''):'<p class="mut">لا عمليات في الأرشيف بعد. تظهر هنا العمليات التي اعتمدتها الشؤون المالية فقط.</p>');
 $('app').innerHTML=`<div class="card"><b>${esc(ME.name)}</b> <span class="mut">${esc(ME.job_title)} · ${esc(ME.site)}</span></div>
 <div class="tabs"><button onclick="renderHome()">${ic('home',14)} الرئيسية</button></div>
 <div class="card"><h3 class="sec">${ic('archive',16)} الأرشيف (${list.length})</h3>${html}</div>`;
}
async function renderAAArchive(q){
 q=q||'';
 const r=await sb.rpc('aa_archive_list',{p_code:ME.code,p_pin:window._pin});
 const all=r.data||[];const nq=_norm(q.trim());
 const list=all.filter(x=>!nq||_norm(x.employee_name).includes(nq));
 const html=r.error?'<div class="err" style="display:block">تعذر تحميل الأرشيف: '+esc(r.error.message)+'</div>':(list.length?list.map(x=>`<div class="req"><h4>${esc(x.employee_name)} <span class="mut">${esc(x.job_title)} · ${esc(x.site)}</span></h4>
  <p><b>${KINDS[x.kind]||''}</b> <span class="chip c-closed">مقفولة</span>${x.sheet_code?` <span class="chip c-pending" style="direction:ltr">${esc(x.sheet_code)}</span>`:''}</p>
  ${x.category?`<p class="mut">${esc(x.category)}</p>`:''}<p>${esc(x.details||'')}</p>${x.amount?`<p>المبلغ: <b>${fmtMoney(x.amount)}</b></p>`:''}${x.paid_amount?`<p>صُرف: ${fmtMoney(x.paid_amount)} · ${esc(x.paid_method||'')} · ${fmtDate(x.paid_date)}</p>`:''}
  ${attLinks(x.attachments)}<p class="mut">قُدّم في ${new Date(x.created_at).toLocaleString('ar-EG')}</p>
  <div class="row"><button class="btn ghost sm" onclick="showHistory('${x.id}')">🕓 السجل</button><button class="btn ghost sm" onclick="restoreAAItem('${x.id}')">إعادة للعمل</button></div><div id="hist-${x.id}"></div></div>`).join(''):'<p class="mut">لا عناصر'+(nq?' بهذا الاسم':' في الأرشيف')+'.</p>');
 $('app').innerHTML=`<div class="card"><b>${ic('users',16)} ${esc(ME.name)}</b> <span class="mut">${esc(ME.job_title)}</span></div>
 <div class="tabs"><button onclick="renderHome()">${ic('home',14)} الرئيسية</button></div>
 <div class="card"><h3 class="sec">${ic('archive',16)} الأرشيف (${list.length})</h3><input id="arq" value="${esc(q)}" placeholder="ابحث باسم المهندس أو العامل" oninput="clearTimeout(window._arT);window._arT=setTimeout(()=>renderAAArchive(document.getElementById('arq').value),350)">${html}</div>`;
 const el=$('arq');if(el&&q){el.focus();el.setSelectionRange(q.length,q.length)}
}
async function restoreAAItem(id){const r=await sb.rpc('aa_archive_restore',{p_code:ME.code,p_pin:window._pin,p_id:id});if(r.error){alert('خطأ: '+r.error.message);return}renderAAArchive();}
async function advDecide(id,action){
 const note=($('ad-'+id)||{}).value||'';
 if(action==='reject'&&!note.trim()){alert('اكتب سبب الرفض');return}
 const r=await sb.rpc('fa_adv_decide',{p_code:ME.code,p_pin:window._pin,p_id:id,p_action:action,p_note:note||null});
 if(r.error){alert('خطأ: '+r.error.message);return}
 renderFA();
}
async function advPay(id,btn){
 const m=$('ap-msg-'+id);const amt=Number($('ap-amt-'+id).value||0),num=$('ap-n-'+id).value.trim();
 if(!(amt>0)){m.innerHTML='<div class="err" style="display:block">اكتب المبلغ</div>';return}
 if(!num){m.innerHTML='<div class="err" style="display:block">اكتب رقم المحفظة أو إنستاباي</div>';return}
 btn.disabled=true;window._payIdem=window._payIdem||{};if(!window._payIdem[id])window._payIdem[id]=crypto.randomUUID();
 const r=await sb.rpc('fa_advance_pay',{p_code:ME.code,p_pin:window._pin,p_request_id:id,p_amount:amt,p_method:$('ap-m-'+id).value,p_number:num,p_date:$('ap-d-'+id).value||null,p_note:null,p_idem:window._payIdem[id]});
 if(r.error){m.innerHTML='<div class="err" style="display:block">'+esc(r.error.message)+'</div>';btn.disabled=false;return}
 m.innerHTML='<div style="background:#dcfce7;color:#166534;padding:8px;border-radius:8px;margin-top:8px">تم تسجيل التحويل وإخطار الإدارية</div>';
 setTimeout(()=>renderFA(),1500);
}
async function closeAdvance(id){const r=await sb.rpc('fa_advance_close',{p_code:ME.code,p_pin:window._pin,p_id:id});if(r.error){alert('خطأ: '+r.error.message);return}renderFA();}
async function reviewBatch(id,action){
 const note=($('bn-'+id)||{}).value||'';
 if(action==='return'&&!note.trim()){alert('اكتب سبب الإرجاع');return}
 const r=await sb.rpc('fa_batch_review',{p_code:ME.code,p_pin:window._pin,p_batch:id,p_action:action,p_note:note||null});
 if(r.error){alert('خطأ: '+r.error.message);return}
 renderFA();
}
async function renderFAAlerts(){
 const act=await sb.rpc('my_activity',{p_code:ME.code,p_pin:window._pin});
 const ns=(act.data&&act.data.notifications)||[];
 const html=ns.length?ns.map(n=>`<div class="req al-yellow"><span class="al-tag al-yellow">${ic('inbox',14)} من الشؤون الإدارية</span>${n.read===false?' <span class="badge inline">جديد</span>':''}<p>${esc(n.text)}</p><span class="mut">${new Date(n.created_at).toLocaleString('ar-EG')}</span></div>`).join(''):'<p class="mut">لا تنبيهات.</p>';
 $('app').innerHTML=`<div class="card"><b>${ic('money',16)} ${esc(ME.name)}</b> <span class="mut">${esc(ME.job_title)}</span></div>
 <div class="tabs"><button onclick="renderHome()">${ic('home',14)} الرئيسية</button><button onclick="renderFA()">${ic('money',14)} الشؤون المالية</button></div>
 <div class="card"><h3 class="sec">${ic('bell',16)} التنبيهات</h3>${html}</div>`;
 if(ns.some(n=>n.read===false))sb.rpc('mark_notifs_read',{p_code:ME.code,p_pin:window._pin}).then(()=>{});
}
async function faAct(id,action){
 const note=($('fn-'+id)||{}).value||'';
 const r=await sb.rpc('fa_decide',{p_code:ME.code,p_pin:window._pin,p_request_id:id,p_action:action,p_note:note||null});
 if(r.error){alert('خطأ: '+r.error.message);return}
 renderFA();
}

// keep pin across renders
const _origRender=renderEmp;
document.addEventListener('input',e=>{if(e.target.id==='pin')window._pin=e.target.value});
(async function boot(){
 let cr=null;try{cr=JSON.parse(localStorage.getItem('bgc_cred')||'null')}catch(e){}
 if(!cr||!cr.c||!cr.p){renderLogin();return}
 try{
  const r=await sb.rpc('staff_login',{p_code:cr.c,p_pin:cr.p});
  if(r.error){renderLogin();return}
  if(r.data&&r.data.length){ME=r.data[0];window._role=ME.role;window._pin=cr.p;renderHome();return}
  try{localStorage.removeItem('bgc_cred')}catch(e){}
 }catch(e){}
 renderLogin();
})();
</script>
